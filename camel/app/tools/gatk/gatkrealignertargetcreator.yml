conda:
  name: gatk
  packages:
    - gatk=3.7
dependencies:
  - java/1.8.0_172
  - gatk/3.7
parameters:
  intervals:
    default: false
    mandatory: false
    option: '-L'
    value: null
  max_interval:
    default: false
    mandatory: false
    option: '-maxInterval'
    value: '500'
  min_reads_at_locus:
    default: false
    mandatory: false
    option: '--minReadsAtLocus'
    value: '4'
  mismatch_fraction:
    default: false
    mandatory: false
    option: '--mismatchFraction'
    value: '0.0'
  output:
    default: true
    mandatory: false
    option: '-o'
    value: indel_realigner.intervals
  window:
    default: false
    mandatory: false
    option: '-window'
    value: '10'
  window_size:
    default: false
    mandatory: false
    option: '--windowSize'
    value: '10'
tool_command: run_gatk.sh -T RealignerTargetCreator
