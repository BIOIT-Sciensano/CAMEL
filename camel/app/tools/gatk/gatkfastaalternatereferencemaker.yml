conda:
  name: gatk
  packages:
    - gatk=3.7
dependencies:
  - java/1.8.0_172
  - gatk/3.7
parameters:
  concatenate_sequence_segments:
    default: false
    mandatory: false
    option: null
    flag: true
  output:
    default: true
    mandatory: false
    option: '-o'
    value: consensus_sequences.fa
  use_iupac_sample:
    default: false
    mandatory: false
    option: '-IUPAC'
    value: null
tool_command: run_gatk.sh -T FastaAlternateReferenceMaker
