conda:
  name: gatk
  packages:
    - gatk=3.7
dependencies:
  - java/1.8.0_172
  - gatk/3.7
parameters:
  exclude_filtered:
    default: false
    mandatory: false
    option: '--excludeFiltered'
    flag: true
  exclude_non_variants:
    default: false
    mandatory: false
    option: '--excludeNonVariants'
    flag: true
  invert_select:
    default: false
    mandatory: false
    option: '-invertSelect'
    flag: true
  max_fraction_filtered_genotypes:
    default: false
    mandatory: false
    option: '--maxFractionFilteredGenotypes'
    value: '1'
  max_indel_size:
    default: false
    mandatory: false
    option: '--maxIndelSize'
    value: '2147483647'
  max_nocall_fraction:
    default: false
    mandatory: false
    option: '--maxNOCALLfraction'
    value: '1'
  min_fraction_filtered_genotypes:
    default: false
    mandatory: false
    option: '--minFractionFilteredGenotypes'
    value: '0'
  min_indel_size:
    default: false
    mandatory: false
    option: '--minIndelSize'
    value: '0'
  output:
    default: true
    mandatory: false
    option: '-o'
    value: selected_variants.vcf
  preserve_alleles:
    default: false
    mandatory: false
    option: '--preserveAlleles'
    flag: true
  remove_unused_alternates:
    default: false
    mandatory: false
    option: '--removeUnusedAlternates'
    flag: true
  restrict_alleles_to:
    default: false
    mandatory: false
    option: '--restrictAllelesTo'
    value: ALL
  select:
    default: false
    mandatory: false
    option: '-select'
    value: null
  select_type_to_exclude:
    default: false
    mandatory: false
    option: '-xlSelectType'
    value: null
  select_type_to_include:
    default: false
    mandatory: false
    option: '-selectType'
    value: null
tool_command: run_gatk.sh -T SelectVariants
