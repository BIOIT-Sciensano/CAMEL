conda:
  name: gatk
  packages:
    - gatk=3.7
dependencies:
  - java/1.8.0_172
  - gatk/3.7
parameters:
  consensus_model:
    default: false
    mandatory: false
    option: '--consensusDeterminationModel'
    value: USE_READS
  entropy_threshold:
    default: false
    mandatory: false
    option: '--entropyThreshold'
    value: '0.15'
  greedy:
    default: false
    mandatory: false
    option: '-greedy'
    value: '120'
  intervals:
    default: false
    mandatory: false
    option: '-L'
    value: null
  max_consensuses:
    default: false
    mandatory: false
    option: '--maxConsensuses'
    value: '30'
  max_isize_for_movement:
    default: false
    mandatory: false
    option: '-maxIsize'
    value: '3000'
  max_positional_move_allowed:
    default: false
    mandatory: false
    option: '-maxPosMove'
    value: '200'
  output:
    default: true
    mandatory: false
    option: '-o'
    value: indel_realigned.bam
  significance:
    default: false
    mandatory: false
    option: '-LOD'
    value: '5.0'
tool_command: run_gatk.sh -T IndelRealigner
