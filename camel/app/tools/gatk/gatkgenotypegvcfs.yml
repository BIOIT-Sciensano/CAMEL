conda:
  name: gatk
  packages:
    - gatk=3.7
dependencies:
  - java/1.8.0_172
  - gatk/3.7
parameters:
  include_non_variant_sites:
    default: false
    mandatory: false
    option: '-allSites'
    flag: true
  output:
    default: true
    mandatory: false
    option: '-o'
    value: genotype_gvcf_multisample.vcf
  ploidy:
    default: true
    mandatory: false
    option: '-ploidy'
    value: '1'
  stand_call_conf:
    default: true
    mandatory: false
    option: '-stand_call_conf'
    value: '30'
  stand_emit_conf:
    default: false
    mandatory: false
    option: '-stand_emit_conf'
    value: '10'
tool_command: run_gatk.sh -T GenotypeGVCFs
