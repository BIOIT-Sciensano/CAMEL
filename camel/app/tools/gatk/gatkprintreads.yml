conda:
  name: gatk
  packages:
    - gatk=3.7
dependencies:
  - java/1.8.0_172
  - gatk/3.7
parameters:
  bam_output:
    default: true
    mandatory: true
    option: '-o'
    value: recalibrated.bam
  intervals:
    default: false
    mandatory: false
    option: '-L'
    value: null
  threads:
    default: true
    mandatory: false
    option: '-nct'
    value: '5'
tool_command: run_gatk.sh -T PrintReads
