conda:
  name: gatk
  packages:
    - gatk=3.7
dependencies:
  - java/1.8.0_172
  - gatk/3.7
parameters:
  active_region_max_size:
    default: false
    mandatory: false
    option: '--activeRegionMaxSize'
    value: null
  active_region_out:
    default: false
    mandatory: false
    option: '--activeRegionOut'
    value: HaplotypeCaller_activeRegion.igv
  activity_profile_out:
    default: false
    mandatory: false
    option: '--activityProfileOut'
    value: HaplotypeCaller_activityProfile.igv
  bam_output:
    default: false
    mandatory: false
    option: '--bamOutput'
    value: HaplotypeCaller_bamOutput.bam
  bam_writer_type:
    default: false
    mandatory: false
    option: '--bamWriterType'
    value: CALLED_HAPLOTYPES
  emit_ref_confidence:
    default: false
    mandatory: false
    option: '-ERC'
    value: NONE
  graph_output:
    default: false
    mandatory: false
    option: '--graphOutput'
    value: HaplotypeCaller_graphOutput.txt
  min_base_quality_score:
    default: false
    mandatory: false
    option: '-mbq'
    value: '10'
  output:
    default: true
    mandatory: false
    option: '-o'
    value: raw.snps.indels.vcf
  ploidy:
    default: true
    mandatory: false
    option: '-ploidy'
    value: '1'
  stand_call_conf:
    default: true
    mandatory: false
    option: '-stand_call_conf'
    value: '30'
  stand_emit_conf:
    default: false
    mandatory: false
    option: '-stand_emit_conf'
    value: '10'
  variant_index_parameter:
    default: false
    mandatory: false
    option: '-variant_index_parameter'
    value: '64000'
  variant_index_type:
    default: false
    mandatory: false
    option: '-variant_index_type'
    value: LINEAR
tool_command: run_gatk.sh -T HaplotypeCaller
